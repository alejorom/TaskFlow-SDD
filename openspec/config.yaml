
schema: spec-driven

context: |
  Project: TaskFlow
  Purpose: REST API for task management and learning Spec-Driven Development.

  Technology:
    - .NET 10
    - ASP.NET Core Web API
    - C#
    - SQL Server
    - Entity Framework Core
    - xUnit for automated testing

  Architecture:
    - Clean Architecture with Domain, Application, Infrastructure and Api.
    - Modular Monolith.
    - Application organized by Features and explicit use cases.
    - Commands and Queries without MediatR initially.
    - Domain must not depend on other application projects.
    - Application depends only on Domain.
    - Infrastructure depends on Application and Domain.
    - Api depends on Application and Infrastructure.

  Architecture documentation:
    - docs/architecture.md
    - docs/architecture-decisions/ADR-001 through ADR-006

  Development conventions:
    - Read the relevant architecture documents before technical design.
    - Follow existing ADRs.
    - Do not introduce new frameworks without justification.
    - Keep the implementation independent of the AI agent provider.
    - Write OpenSpec artifacts in Spanish.
    - Keep C# identifiers and API routes in English.
    - Specify and review behavior before implementing code.

rules:
  proposal:
    - Explain the business problem and expected outcome.
    - Define scope and exclusions.
    - Do not include implementation code.

  specs:
    - Express requirements as observable behavior.
    - Include verifiable scenarios.
    - Cover relevant validation and error cases.
    - Avoid implementation details.

  design:
    - Reference applicable architecture decisions.
    - Explain responsibilities across Clean Architecture layers.
    - Organize Application use cases by Features.
    - Document significant trade-offs.

  tasks:
    - Break implementation into small, verifiable tasks.
    - Include automated tests where appropriate.
    - Keep tasks aligned with specs and design.

operations:
  apply:
    guidance:
      - Follow the approved specs and design.
      - Do not change architectural decisions silently.
      - Run relevant tests before marking tasks complete.
